name: Crawl Licensing Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [gh-pages]
    paths:
      - "crawler/**"
      - ".github/workflows/crawl-licensing-universe.yml"

permissions:
  contents: write

concurrency:
  group: licensing-universe-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out research application
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.5 \
            beautifulsoup4==4.13.5 \
            lxml==6.0.1 \
            pypdf==6.0.0 \
            rapidfuzz==3.14.0 \
            selenium==4.35.0

      - name: Crawl agencies, licensors, directories and portfolios
        env:
          MAX_SITES: "500"
          MAX_PAGES_PER_SITE: "8"
          MAX_WORKERS: "18"
          REQUEST_TIMEOUT: "14"
          SEARCH_RESULTS_PER_QUERY: "12"
        run: |
          python crawler/run_crawl.py 2>&1 | tee /tmp/licensing-crawl.log

      - name: Prove that the database is populated
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db_path = Path('data/licensing_universe.sqlite')
          json_path = Path('data/licensing_universe.json')
          assert db_path.exists() and db_path.stat().st_size > 10_000, db_path
          assert json_path.exists() and json_path.stat().st_size > 10_000, json_path
          con = sqlite3.connect(db_path)
          counts = {
              'organisations': con.execute('select count(*) from organisations').fetchone()[0],
              'agencies': con.execute("select count(*) from organisations where organisation_type='licensing_agency'").fetchone()[0],
              'pages': con.execute('select count(*) from pages').fetchone()[0],
              'representations': con.execute('select count(*) from representations').fetchone()[0],
              'sources': con.execute('select count(*) from sources').fetchone()[0],
          }
          con.close()
          print(json.dumps(counts, indent=2))
          assert counts['organisations'] >= 75, counts
          assert counts['agencies'] >= 25, counts
          assert counts['pages'] >= 40, counts
          assert counts['sources'] >= 50, counts
          PY

      - name: Publish database and exports
        run: |
          git config user.name "Leatherback Licensing Atlas Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/licensing_universe.sqlite \
            data/licensing_universe.json \
            data/agencies.csv \
            data/agency_client_relationships.csv \
            data/crawl_sources.csv \
            data/stats.json \
            data/crawl_errors.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
            exit 0
          fi
          git commit -m "Update scraped licensing universe database [skip ci]"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensing-universe-crawl-log
          path: |
            /tmp/licensing-crawl.log
            data/stats.json
            data/crawl_errors.json
          if-no-files-found: ignore
          retention-days: 14
