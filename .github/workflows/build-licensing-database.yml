name: Build Licensing Market Database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [gh-pages]
    paths:
      - 'crawler/parts/**'
      - '.github/workflows/build-licensing-database.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: licensing-market-database
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out database branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Assemble crawler and source universe
        run: |
          cat crawler/parts/build-*.part > crawler/build_database.py
          cat crawler/parts/sources-*.part > crawler/source_registry.csv
          python -m py_compile crawler/build_database.py
          test "$(wc -l < crawler/source_registry.csv)" -ge 90

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Crawl public licensing sources and build SQLite database
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python crawler/build_database.py --concurrency 4 --browser-concurrency 1 2>&1 | tee /tmp/licensing-crawl.log

      - name: Validate generated database
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db = Path('data/licensing_database.sqlite')
          assert db.exists() and db.stat().st_size > 50_000, db
          conn = sqlite3.connect(db)
          assert conn.execute('pragma integrity_check').fetchone()[0] == 'ok'
          checks = {
              'sources': conn.execute('select count(*) from sources').fetchone()[0],
              'pages': conn.execute('select count(*) from pages').fetchone()[0],
              'companies': conn.execute('select count(*) from companies').fetchone()[0],
              'agencies': conn.execute("select count(*) from companies where company_type='licensing_agency'").fetchone()[0],
              'brands': conn.execute('select count(*) from brands').fetchone()[0],
              'representations': conn.execute('select count(*) from representations').fetchone()[0],
              'evidence': conn.execute('select count(*) from evidence').fetchone()[0],
          }
          print(json.dumps(checks, indent=2))
          assert checks['sources'] >= 90, checks
          assert checks['agencies'] >= 70, checks
          conn.close()
          PY

      - name: Commit populated database and exports
        run: |
          git config user.name 'Leatherback Licensing Database Bot'
          git config user.email 'matthew@leatherbacktravel.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No database changes to commit.'
          else
            git commit -m "Refresh populated licensing market database"
            git push origin HEAD:gh-pages
          fi

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensing-crawl-log
          path: /tmp/licensing-crawl.log
          retention-days: 14
          if-no-files-found: ignore
