<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b16"><title>Leatherback Licensing Atlas</title><style>html,body{margin:0;min-height:100%;background:#f5f4ef;font-family:system-ui;color:#17211d}.boot{min-height:100vh;display:grid;place-items:center}.boot div{text-align:center}.mark{width:46px;height:46px;margin:0 auto 14px;border-radius:12px;display:grid;place-items:center;background:#f2b955;font-weight:800}.msg{font-size:13px;color:#66716c}</style></head><body><div class="boot"><div><div class="mark">LA</div><div class="msg">Loading the Licensing Atlas…</div></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Please use a current browser.');const names=['bundle-1.txt','bundle-2.txt','bundle-3.txt','bundle-4.txt','bundle-6.txt'];const parts=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error('Bundle load failed: '+n);return r.text()})));const b=parts.join('').trim(),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="padding:40px;max-width:700px;margin:auto"><h1>Licensing Atlas</h1><p>'+String(e.message||e)+'</p></main>'}})();</script></body></html>
