<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b16"><link rel="icon" href="data:,"><title>Leatherback Licensing Atlas</title><style>html,body{margin:0;min-height:100%;background:#f5f4ef;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot-card{text-align:center;max-width:460px}.mark{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;display:grid;place-items:center;background:#f2b955;color:#17211d;font-weight:850}.title{font-size:18px;font-weight:760}.msg{margin-top:8px;font-size:13px;line-height:1.5;color:#66716c}.bar{width:240px;height:4px;margin:18px auto 0;border-radius:999px;background:#dfe2dd;overflow:hidden}.bar>span{display:block;height:100%;width:24%;background:#1f5d46;border-radius:inherit;animation:load 1.15s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-10%)}to{transform:translateX(330%)}}.error{max-width:720px;margin:80px auto;padding:28px}.error pre{white-space:pre-wrap;background:#fff;padding:16px;border:1px solid #ddd;border-radius:10px}</style></head><body><div class="boot"><div class="boot-card"><div class="mark">LA</div><div class="title">Leatherback Licensing Atlas</div><div class="msg" id="status">Loading the research workspace…</div><div class="bar"><span></span></div></div></div><script>(()=>{const base='https://raw.githubusercontent.com/leatherbacktravel/matgpt/gh-pages/licensing-atlas/';const names=['bundle-1.txt','bundle-2.txt','bundle-3.txt','bundle-4.txt','bundle-6.txt'];const status=document.getElementById('status');const fail=e=>{document.body.innerHTML='<main class="error"><h1>Licensing Atlas could not load</h1><p>Refresh the page. If the problem continues, retain this error for diagnosis.</p><pre>'+String(e&&e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></main>'};const installResearchBridge=()=>{const nativeFetch=window.fetch.bind(window);window.fetch=async(input,init={})=>{const raw=typeof input==='string'?input:(input&&input.url)||'';let request;try{request=new URL(raw,location.href)}catch{return nativeFetch(input,init)}if(request.origin!==location.origin||!/^\/api\/(check-source|inspect-source)$/.test(request.pathname))return nativeFetch(input,init);const target=request.searchParams.get('url');const started=performance.now();try{const parsed=new URL(target);if(!['http:','https:'].includes(parsed.protocol))throw new Error('Only public http and https URLs are supported.');const readerUrl='https://r.jina.ai/'+parsed.href;const response=await nativeFetch(readerUrl,{method:'GET',headers:{Accept:'text/plain'},cache:'no-store'});const text=await response.text();if(!response.ok)throw new Error('Reader service returned HTTP '+response.status+'.');const titleMatch=text.match(/^Title:\s*(.+)$/m)||text.match(/^#\s+(.+)$/m);const headings=[...text.matchAll(/^#{1,3}\s+(.+)$/gm)].map(m=>m[1].trim()).filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,20);const links=[];const seen=new Set();for(const match of text.matchAll(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g)){if(seen.has(match[2]))continue;seen.add(match[2]);links.push({text:match[1].trim(),url:match[2]});if(links.length>=30)break}const content=text.split(/Markdown Content:\s*/i)[1]||text;const description=content.replace(/^#{1,6}\s+/gm,'').replace(/\[[^\]]+\]\([^)]+\)/g,'').replace(/\s+/g,' ').trim().slice(0,500);const payload={ok:true,status:response.status,finalUrl:parsed.href,elapsedMs:Math.round(performance.now()-started),contentType:response.headers.get('content-type')||'text/markdown',bytes:new TextEncoder().encode(text).length,title:(titleMatch&&titleMatch[1]||parsed.hostname).trim().slice(0,240),description,headings,links,checkedAt:new Date().toISOString(),reader:'Jina Reader'};return new Response(JSON.stringify(payload),{status:200,headers:{'content-type':'application/json'}})}catch(error){return new Response(JSON.stringify({ok:false,error:error&&error.message||'Public source inspection failed.',checkedAt:new Date().toISOString()}),{status:502,headers:{'content-type':'application/json'}})}}};(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Use a current version of Chrome, Edge, Firefox or Safari.');const parts=[];for(let i=0;i<names.length;i++){status.textContent='Loading research data '+(i+1)+' of '+names.length+'…';const r=await fetch(base+names[i],{cache:'no-cache'});if(!r.ok)throw new Error('Research bundle request failed ('+r.status+'): '+names[i]);parts.push(await r.text())}status.textContent='Opening workspace…';const encoded=parts.join('').replace(/\s+/g,'');const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();if(!html.includes('Leatherback Licensing Atlas'))throw new Error('Application bundle integrity check failed.');html=html.replace('Use the deployed server endpoint to check or inspect public source pages. Results are saved to this browser workspace.','Checks and inspects public source pages through a browser-accessible reader service. Results are saved to this browser workspace.').replace('Server-side fetch result; no login or paywall bypassing.','Public-page fetch result; no login or paywall bypassing.');installResearchBridge();document.open();document.write(html);document.close()}catch(e){fail(e)}})()})();</script></body></html>
