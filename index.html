<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b16"><title>Leatherback Licensing Atlas</title><style>html,body{margin:0;min-height:100%;background:#f5f4ef;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot-card{text-align:center;max-width:460px}.mark{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;display:grid;place-items:center;background:#f2b955;color:#17211d;font-weight:850}.title{font-size:18px;font-weight:760}.msg{margin-top:8px;font-size:13px;line-height:1.5;color:#66716c}.bar{width:240px;height:4px;margin:18px auto 0;border-radius:999px;background:#dfe2dd;overflow:hidden}.bar>span{display:block;height:100%;width:24%;background:#1f5d46;border-radius:inherit;animation:load 1.15s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-10%)}to{transform:translateX(330%)}}.error{max-width:720px;margin:80px auto;padding:28px}.error pre{white-space:pre-wrap;background:#fff;padding:16px;border:1px solid #ddd;border-radius:10px}</style></head><body><div class="boot"><div class="boot-card"><div class="mark">LA</div><div class="title">Leatherback Licensing Atlas</div><div class="msg" id="status">Loading the research workspace…</div><div class="bar"><span></span></div></div></div><script>(()=>{const base='https://raw.githubusercontent.com/leatherbacktravel/matgpt/gh-pages/licensing-atlas/';const names=['bundle-1.txt','bundle-2.txt','bundle-3.txt','bundle-4.txt','bundle-5.txt'];const status=document.getElementById('status');const fail=e=>{document.body.innerHTML='<main class="error"><h1>Licensing Atlas could not load</h1><p>Refresh the page. If the problem continues, retain this error for diagnosis.</p><pre>'+String(e&&e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></main>'};(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Use a current version of Chrome, Edge, Firefox or Safari.');const parts=[];for(let i=0;i<names.length;i++){status.textContent='Loading research data '+(i+1)+' of '+names.length+'…';const r=await fetch(base+names[i],{cache:'no-cache'});if(!r.ok)throw new Error('Research bundle request failed ('+r.status+'): '+names[i]);parts.push(await r.text())}status.textContent='Opening workspace…';const encoded=parts.join('').replace(/\s+/g,'');const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('Leatherback Licensing Atlas'))throw new Error('Application bundle integrity check failed.');document.open();document.write(html);document.close()}catch(e){fail(e)}})()})();</script></body></html>
